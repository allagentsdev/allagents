version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @types/node must stay on the major declared by `engines.node` (>=22).
      # Types newer than the runtime floor let `tsc` accept APIs that do not
      # exist on the oldest supported Node release. Bump both together.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: bun
    directory: /docs
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Etc/UTC
    cooldown:
      default-days: 2
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope

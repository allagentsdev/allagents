name: Publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to publish to npm (for example v1.16.7)"
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Release tag to publish to npm"
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release tag
        id: release
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="v${VERSION}"

          if [ "$REQUESTED_REF" != "$RELEASE_TAG" ]; then
            echo "::error::Ref '$REQUESTED_REF' does not match the package version $RELEASE_TAG at that ref"
            exit 1
          fi

          if ! git tag --points-at HEAD | grep -Fx "$RELEASE_TAG" >/dev/null; then
            echo "::error::$RELEASE_TAG is not a tag at the checked-out commit; tags at HEAD:"
            git tag --points-at HEAD || true
            exit 1
          fi

          if [[ "$VERSION" == *"-"* ]]; then
            NPM_TAG="next"
          else
            NPM_TAG="latest"
          fi

          echo "Publishing $RELEASE_TAG with npm dist-tag $NPM_TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: |
          set -euo pipefail

          RELEASE_TAG="v${VERSION}"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists"
            exit 0
          fi

          if [ "$NPM_TAG" = "next" ]; then
            gh release create "$RELEASE_TAG" --generate-notes --prerelease
          else
            gh release create "$RELEASE_TAG" --generate-notes
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: true
        run: bun run publish:${{ steps.release.outputs.npm_tag }}

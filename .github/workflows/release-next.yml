name: Release Next

on:
  workflow_dispatch:

concurrency:
  group: release-next
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  next:
    name: Tag the next prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the pending release
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_HEAD=$(gh pr list --label 'autorelease: pending' --state open --json headRefName --jq '.[0].headRefName')
          if [ -z "$PR_HEAD" ]; then
            echo "::error::No open Release Please release pull request; nothing to preview"
            exit 1
          fi

          git fetch origin "$PR_HEAD"
          git checkout --detach FETCH_HEAD

          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Previewing the pending release $VERSION from $PR_HEAD"

      - name: Compute the prerelease tag
        id: release
        env:
          VERSION: ${{ steps.pending.outputs.version }}
        run: |
          set -euo pipefail

          LATEST=$(git tag --list "v${VERSION}-next.*" --sort=-version:refname | head -n 1)
          if [ -z "$LATEST" ]; then
            NUMBER=1
          else
            NUMBER=$(( ${LATEST##*-next.} + 1 ))
          fi

          TAG="v${VERSION}-next.${NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Prerelease tag $TAG"

      - name: Tag the prerelease commit
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The prerelease version lives in the tagged commit, not on main, so
          # the release pull request stays the only version source for stable
          # releases and Release Please keeps resolving its base from the
          # manifest version.
          node -e "const fs=require('fs');const p='package.json';const s=fs.readFileSync(p,'utf8');fs.writeFileSync(p, s.replace(/\"version\": \"[^\"]+\"/, '\"version\": \"${TAG#v}\"'));"
          node -p "require('./package.json').version"

          git add package.json
          git commit -m "chore(release): release ${TAG#v}"
          git tag "$TAG"
          git push origin "$TAG"

  publish-npm:
    name: Publish prerelease to npm
    needs: next
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.next.outputs.tag }}
